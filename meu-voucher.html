const app=document.getElementById("app");
let vendo=null;

function form(msg){
  app.innerHTML=`<div class="card">
    <label for="cp">Seu cupom</label>
    <input id="cp" placeholder="Ex.: MARIA10" autocomplete="off" autocapitalize="characters">
    <label for="doc">4 últimos números do seu CPF</label>
    <input id="doc" placeholder="0000" inputmode="numeric" maxlength="4" autocomplete="off">
    <button id="ver">Ver meu saldo</button>
    <p class="erro">${msg?esc(msg):""}</p>
  </div>`;
  const go=()=>{
    const c=(document.getElementById("cp").value||"").trim().toUpperCase();
    const d=(document.getElementById("doc").value||"").replace(/\D/g,"");
    if(!c||d.length<4){form("Preencha o cupom e os 4 números do CPF.");return;}
    const p=D.find(x=>x.c===c&&x.p===d);
    if(!p){form("Não encontrei. Confira o cupom e os 4 últimos números do CPF. Se continuar assim, chama a gente no WhatsApp.");return;}
    vendo=p; tela();
  };
  document.getElementById("ver").onclick=go;
  document.getElementById("doc").onkeydown=e=>{if(e.key==="Enter")go();};
}

function tela(){
  const p=vendo;
  app.innerHTML=`<div class="card">
    <p class="oi">Oi, <b>${esc(p.n.split(" ")[0])}</b> · cupom ${esc(p.c)}</p>
    <div class="saldo"><div class="v">R$ ${brl(p.s)}</div>
      <div class="l">${p.s>0?"disponível para usar no site":"você já usou todo o seu saldo"}</div></div>
    <table><tbody>${p.e.map(l=>`<tr>
      <td>${esc(l.m.replace(/^Desafio · /,"").replace(/ \(\d+ cupons\)/,""))}
        ${l.vc?`<br><span class="q">código ${esc(l.vc)}</span>`:""}
        <br><span class="q">${dia(l.d)}</span></td>
      <td class="num ${l.v>=0?"mais":"menos"}">${l.v>=0?"+":"−"} R$ ${brl(Math.abs(l.v))}</td></tr>`).join("")}

      compras. Pode resgatar tudo de uma vez ou em partes, e o saldo não vence.</div>`

}
